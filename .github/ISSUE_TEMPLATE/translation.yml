name: 认领翻译或人工审校
description: 为具备发布资格的论文认领机器初译、术语核对或人工技术审校。
title: "[translation] "
labels: ["translation"]
body:
  - type: input
    id: paper_id
    attributes:
      label: Paper ID
      description: 例如 arXiv:2203.07864。
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 认领阶段
      options:
        - 机器初译
        - 术语统一
        - 人工技术审校
        - 公式与引用核对
        - 中文表达润色
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 相关背景
      description: 简述相关学科、翻译或审校经验；无需提供私人联系方式。
  - type: checkboxes
    id: gates
    attributes:
      label: 发布闸门确认
      options:
        - label: 我已确认目录中该论文 `publication_allowed=true`。
          required: true
        - label: 我会遵守逐篇来源许可证和项目翻译流程。
          required: true
        - label: 我不会提交原始 PDF、邮箱、私人通信或未脱敏授权证据。
          required: true
